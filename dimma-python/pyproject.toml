[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimma"
version = "1.0.1"
description = "Motor de seguranca ciberetica declarativo baseado em arquivos .dimma"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "DiMMA" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "flask", "middleware", "scanner", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "Topic :: Security",
]
dependencies = [
    "flask>=3.0",
    "flask-talisman>=1.1.0",
    "flask-limiter>=4.1.0",
    "flask-wtf>=1.3.0",
    "bcrypt>=5.0.0",
    "webauthn>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/diamantino-dimma/dimma-security"
Source = "https://github.com/diamantino-dimma/dimma-security"
Issues = "https://github.com/diamantino-dimma/dimma-security/issues"

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.scripts]
dimma = "dimma.cli:main"

[tool.setuptools.packages.find]
include = ["dimma*"]

[tool.setuptools.package-data]
dimma = ["assets/*.vsix"]
