name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    defaults:
      run:
        working-directory: dimma-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npx better-npm-audit audit --production --level high --exclude GHSA-vfj7-8cjw-p6xm
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: dimma-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python test/run_all.py
      - run: python -m compileall -q dimma test example
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        run: python -m twine check dist/*
