name: Publish Python package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Test, build, and publish dimma
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dimma
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dimma-python
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run Python test suites
        run: python test/run_all.py

      - name: Check Python sources compile
        run: python -m compileall -q dimma test example

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dimma-python/dist
